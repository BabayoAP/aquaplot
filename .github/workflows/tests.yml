# Runs the test suite on every pull request and on every push to main, so a change that
# breaks something shows a red cross on its PR instead of being found after the merge.
# The tests need no network, no model and no API key (every outside call is injectable),
# so this needs no secrets.
name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to the same PR cancels the run it replaces.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install AquaPlot and its test tools
        run: python -m pip install -e ".[dev]"
      - name: Run the tests
        run: python -m pytest -q
