[project]
name = "riffle"
version = "0.1.0"
description = "Riffle: guided citizen stream checks that turn a photo into a WFD-banded stream-health reading and a One Health signal"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pillow>=10.4",
    "pillow-heif>=0.18",
    "httpx>=0.27",
    "anthropic>=1.6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/riffle"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
