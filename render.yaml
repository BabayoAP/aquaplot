# Render Blueprint: one-click deploy for the hackathon live link.
# https://render.com/docs/blueprint-spec
#
# Free plan, so no persistent disk: the database lives in the container and is
# emptied on every restart and redeploy. AQUAPLOT_SEED_DEMO refills it with the
# labelled demo sites at startup, so the dashboard, map and outlook are never
# empty when someone opens the link. For a deployment that keeps citizens' data,
# use a paid instance with a disk and point AQUAPLOT_DB at it.
services:
  - type: web
    name: aquaplot
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # Optional. Without a key, photos are not read automatically and the citizen
      # fills the form by hand; the sample check still shows the second opinion,
      # because its model reading is recorded. Everything else is identical.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CLAUDE_MODEL
        value: claude-opus-5
      - key: AQUAPLOT_SEED_DEMO
        value: "1"
      # Assessments per client address per 10 minutes; protects the key.
      - key: AQUAPLOT_CLASSIFY_LIMIT
        value: "20"
      # Live Claude photo readings for a public test (src/aquaplot/allowance.py): each tester
      # (browser), each network per day, and the whole server per day. 0 turns one off. Past a
      # limit the check still runs by hand. On the free plan the database starts empty after a
      # restart, and a free instance restarts whenever it wakes from idling, so these counts reset
      # with it: set a spending limit on the key in the Anthropic console as well, which is the one
      # nothing can get round.
      - key: AQUAPLOT_LIVE_PER_TESTER
        value: "2"
      - key: AQUAPLOT_LIVE_PER_NETWORK
        value: "10"
      - key: AQUAPLOT_LIVE_PER_DAY
        value: "40"
